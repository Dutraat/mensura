  /* ===== v32 · Estilo Ouro Uniforme, Selo Minimalista c/ Bolinha, Saudação Maior e Comparador Lado a Lado ===== */
  :root {
    --bg: #f4f1ea; --panel: #ffffff; --zebra: #faf8f3; --line: #e4dfd3; --ink: #151a27; --muted: #5a6170;
    --brand: #2f5597; --brand-ink: #ffffff; --brand-soft: #e5ecf7;
    --gold: #f0c45a; --gold-soft: #fdf5df; --gold-border: #e5b94e; --gold-ink: #594007;
    --radius: 16px; --shadow: 0 1px 2px rgba(16,24,40,.04), 0 10px 28px rgba(16,24,40,.06);
    --c1: #2f5597; --c2: #f0c45a;
  }
  aside .co { display: none !important; }
  aside .brandmark { padding: 20px 16px 14px; }
  svg.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .attn2 {
    background: radial-gradient(circle at 88% 18%, rgba(240, 196, 90, 0.50) 0%, rgba(240, 196, 90, 0.16) 36%, transparent 62%),
                linear-gradient(125deg, var(--brand) 0%, color-mix(in srgb, var(--brand) 78%, #0f1b33) 100%) !important;
    border-bottom: 4px solid var(--gold) !important;
    box-shadow: 0 12px 30px color-mix(in srgb, var(--brand) 26%, transparent);
  }
  .attn2 .ah small {
    display: inline-block; font-size: 19px !important; font-weight: 700 !important;
    opacity: 1 !important; color: var(--gold-soft) !important; letter-spacing: -0.01em; margin-bottom: 4px;
  }
  .attn2 .ah .btn {
    background: var(--gold-soft) !important; color: var(--gold-ink) !important;
    border: 1.5px solid var(--gold) !important; font-weight: 750;
  }
  .attn2 .atile.info .aico { background: var(--gold-soft); color: var(--gold-ink); border: 1px solid var(--gold); }

  .nb:not(.bad):not(.warn) { background: var(--gold-soft); color: var(--gold-ink); border: 1px solid var(--gold); }
  .dg.c4 > .kq:nth-child(odd), .grid.kpis > .kpi:nth-child(odd) { border-top: 3px solid var(--brand); }
  .dg.c4 > .kq:nth-child(even), .grid.kpis > .kpi:nth-child(even) { border-top: 3px solid var(--gold); }
  .dh2::before, .content h2::before {
    content: ""; width: 4px; height: 15px; border-radius: 4px; background: var(--gold);
    display: inline-block; margin-right: 8px; vertical-align: -2px;
  }
  .dh2::before { margin-right: 0; }
  .card.rcard { border-left: 4px solid var(--brand); }
  .scroll table thead th { border-bottom: 2px solid color-mix(in srgb, var(--brand) 30%, var(--line)); }
  .fsteps button[aria-current="step"] .stepn { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }

  .tbox {
    background: var(--brand) !important; color: #ffffff !important;
    box-shadow: 0 3px 10px color-mix(in srgb, var(--brand) 26%, transparent);
    border: 1px solid color-mix(in srgb, #ffffff 15%, var(--brand)); padding: 6px 6px;
  }
  .tbox b, .tbox small { color: #ffffff !important; }
  .tbox small { opacity: 0.94; font-weight: 700; }

  .rem-pill {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 4px;
    font-size: 12.5px; font-weight: 600; width: fit-content; line-height: 1.2;
    font-variant-numeric: tabular-nums; background: #ffffff; color: var(--ink);
    border: 1.5px solid var(--gold); border-radius: 999px; padding: 3px 11px;
  }
  .rem-pill .rdot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); border: 1px solid #d4a73a; flex: none; }
  .rem-pill b { font-weight: 750; color: var(--ink); }

  /* Estilo Minimalista com Bolinha (.chip) */
  .chip {
    background: var(--bg) !important; color: var(--ink) !important;
    border: 1px solid var(--line) !important; border-radius: 999px !important;
    padding: 4px 12px 4px 10px !important; font-weight: 650 !important;
  }
  .chip .sym { display: none !important; }
  .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
  .chip.warn { background: #ffffff !important; border-color: var(--gold) !important; }
  .chip.warn::before { background: var(--gold); }
  .chip.bad { background: #ffffff !important; border-color: #fca5a5 !important; color: #991b1b !important; }
  .chip.bad::before { background: #dc2626; }
  .chip.info { background: #ffffff !important; border-color: color-mix(in srgb, var(--brand) 38%, transparent) !important; color: var(--brand) !important; }
  .chip.info::before { background: var(--brand); }
  .chip.ok::before { background: #16a34a; }

  /* Pop-up do Comparador */
  :root.cmp-popup-open body { overflow: hidden; }
  :root.cmp-popup-open #view {
    position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100vh !important;
    max-width: none !important; z-index: 88 !important; background: var(--bg) !important;
    padding: 16px 24px 76px !important; overflow-y: auto !important; overflow-x: hidden !important;
    box-sizing: border-box !important; animation: cmpPopIn .16s ease-out;
  }
  @keyframes cmpPopIn { from { opacity: 0; transform: scale(0.99); } to { opacity: 1; transform: scale(1); } }
  :root.cmp-popup-open #view > .crumb, :root.cmp-popup-open #view > .pagehelp, :root.cmp-popup-open #view > .fbar { display: none !important; }
  .cmp-pop-bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--brand);
    border-radius: var(--radius); padding: 11px 18px; margin-bottom: 10px; box-shadow: var(--shadow);
  }

  .cmp-pop-badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--gold-soft); color: var(--gold-ink); border: 1px solid var(--gold); }
  .cmp-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 14px; margin-bottom: 12px; }
  .cmp-lay-seg { display: inline-flex; background: var(--bg); padding: 3px; border-radius: 999px; border: 1px solid var(--line); gap: 2px; }
  .cmp-lay-seg button { all: unset; cursor: pointer; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .cmp-lay-seg button.on { background: var(--brand); color: #ffffff; font-weight: 700; }
  #cmpBody, #cmpBody .scroll { overflow-x: hidden !important; max-width: 100% !important; }
  :root.cmp-popup-open #cmpBody .scroll { max-height: none !important; overflow: visible !important; box-shadow: none; border: 0; background: transparent; }
  .cmp-split { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 900px) { .cmp-split { grid-template-columns: 1fr; } }
  .cmp-split-list { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; display: grid; gap: 4px; max-height: calc(100vh - 220px); overflow-y: auto; box-shadow: var(--shadow); }
  .cmp-split-item { all: unset; box-sizing: border-box; cursor: pointer; padding: 10px 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 4px; border: 1px solid transparent; transition: background .12s; }
  .cmp-split-item:hover { background: var(--bg); }
  .cmp-split-item.on { background: var(--brand-soft); border-color: var(--brand); box-shadow: inset 3px 0 0 var(--brand); }
  .cmp-split-detail { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
  .cmp-offers-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; align-items: stretch; }
  .cmp-ocard { border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 15px; background: var(--bg); cursor: pointer; display: flex; flex-direction: column; gap: 6px; transition: transform .12s, border-color .12s, box-shadow .12s, background .12s; position: relative; min-width: 0; }
  .cmp-ocard:hover:not(.done) { border-color: var(--brand); background: var(--brand-soft); transform: translateY(-1px); }
  .cmp-ocard.best { background: color-mix(in srgb, var(--ok-soft) 65%, var(--panel)); border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
  .cmp-ocard.pick { background: var(--brand-soft) !important; border-color: var(--brand) !important; box-shadow: 0 0 0 2px var(--gold), 0 6px 16px color-mix(in srgb, var(--brand) 16%, transparent); }
  .cmp-ocard.done { opacity: .55; cursor: not-allowed; }
  .cmp-ocard-sup { font-size: 13.5px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 8px; line-height: 1.25; }
  .cmp-ocard-sup span.sn { flex: 1; overflow-wrap: anywhere; }

  .cmp-ocard-sub { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .cmp-ocard-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; padding-top: 6px; }
  .cmp-cards-list { display: grid; gap: 12px; }
  .cmp-icard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: stretch; }
  @media (max-width: 860px) { .cmp-icard { grid-template-columns: 1fr; } }

  .cmp-icard-hist { margin-top: auto; padding-top: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  table.cmp-fit { table-layout: fixed !important; width: 100% !important; border-collapse: separate; border-spacing: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  table.cmp-fit th, table.cmp-fit td { white-space: normal !important; overflow-wrap: break-word !important; word-break: break-word !important; min-width: 0 !important; max-width: none !important; padding: 10px 10px !important; vertical-align: top; }

<script>
/* ================= Utilidades ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=v=>Math.round((v+Number.EPSILON)*100)/100;
const money=v=>(v==null||isNaN(v))?'—':v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const moneyU=v=>(v==null||isNaN(v))?'—':v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:4});
const numFmt=v=>Number(v).toLocaleString('pt-BR',{maximumFractionDigits:4});
const pct=v=>v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';

const parseBR=s=>{ s=String(s==null?'':s).trim().replace(/\s/g,'').replace(/^R\$/,''); if(s==='')return NaN; if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const v=Number(s); return isFinite(v)?v:NaN; };
const toStr=v=>(v===0||v)?String(v).replace('.',','):'';

const addDays=(s,n)=>{ const d=new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+Math.round(n)); return d.toISOString().slice(0,10); };
function reportDoc(title,body,print){ const css=document.querySelector('style').textContent.replace(/@media \(prefers-color-scheme: dark\)\{[\s\S]*?\}\s*\}/,'');

let _cap=null, _printNext=false;

/* ================= Regras de cálculo (mesmas do app) ================= */
const lineNet=l=> l.scope==='unit' ? l.q*l.p - l.q*l.d : l.q*l.p - l.d;
/* Imposto (l.t, em %) incide sobre o valor líquido da linha + custo extra. Deixe 0 quando o preço já inclui impostos. */
const lineTax=l=> r2((lineNet(l)+(l.x||0))*(l.t||0)/100);
const lineTotal=l=> r2(lineNet(l)+(l.x||0)+lineTax(l));
const costOf=o=> r2(o.lines.reduce((s,l)=>s+lineTotal(l),0) + (o.freeIncl?0:o.freight) + o.other - o.disc);
const taxOf=o=> r2(o.lines.reduce((s,l)=>s+lineTax(l),0));
const goodsOf=o=> r2(o.lines.reduce((s,l)=>s+lineNet(l)+(l.x||0),0));
/* Preço unitário efetivo: após desconto e impostos, sem frete (comparável entre fornecedores e ao longo do tempo) */
const effUnit=l=> l.q>0 ? lineNet(l)*(1+(l.t||0)/100)/l.q : 0;
/* Custo real unitário: total da linha + parte do frete/outras despesas/desconto global (rateio proporcional ao valor) */
function landedUnit(o,l){ const S=o.lines.reduce((s,x)=>s+lineTotal(x),0), add=(o.freeIncl?0:o.freight)+o.other-o.disc;
  return l.q>0 ? (lineTotal(l)+(S>0?lineTotal(l)/S*add:0))/l.q : 0; }
/* Condição de pagamento -> prazo médio em dias (à vista = 0; "30/60/90" = 60; vazio = desconhecido) */
function payDays(s){ s=String(s||'').toLowerCase(); if(/vista|antecip|pix|imediat/.test(s)) return 0; const n=(s.match(/\d+/g)||[]).map(Number); return n.length?n.reduce((a,b)=>a+b,0)/n.length:null; }
/* Valor presente: pagar em N dias vale menos que pagar hoje (taxa mensal configurável) */
const finOn=()=>DB.fin&&DB.fin.on!==false, finRate=()=>(DB.fin&&Number(DB.fin.rate)>=0)?Number(DB.fin.rate):1.5;
const pvOf=o=>{ const d=payDays(o.pay); return d==null?costOf(o):r2(costOf(o)/Math.pow(1+finRate()/100,d/30)); };
const cmpCost=o=>finOn()?pvOf(o):costOf(o);
const variation=(cur,ref)=> ref>0 ? r2((cur-ref)/ref*100) : null;

/* ================= Comparabilidade ================= */
function compareQuotes(sel){
  const blocks=[], warns=[];
  const ids=[...new Set(sel.flatMap(q=>q.lines.map(l=>l.iid)))];
  ids.forEach(iid=>{
    const ls=sel.map(q=>({q,l:q.lines.find(l=>l.iid===iid)}));
    const miss=ls.filter(x=>!x.l);
    if(miss.length){ blocks.push(`“${iName(iid)}” não consta na cotação de ${miss.map(x=>sName(x.q.sid)).join(', ')}: conjunto de itens diferente.`); return; }
    if(new Set(ls.map(x=>(x.l.u||'').trim().toLowerCase())).size>1) blocks.push(`“${iName(iid)}”: unidades diferentes (${[...new Set(ls.map(x=>x.l.u))].join(' × ')}).`);
    if(new Set(ls.map(x=>(x.l.pk||'').trim().toLowerCase())).size>1) blocks.push(`“${iName(iid)}”: embalagens diferentes (${[...new Set(ls.map(x=>x.l.pk||'—'))].join(' × ')}).`);
    if(new Set(ls.map(x=>x.l.q)).size>1) warns.push(`“${iName(iid)}”: quantidades diferentes entre as cotações.`);
  });
  if(new Set(sel.map(q=>(q.pay||'').trim().toLowerCase())).size>1) warns.push('Condições de pagamento diferentes: considere o impacto financeiro.');
  if(new Set(sel.map(q=>q.freeIncl)).size>1) warns.push('Tratamento de frete diferente (incluído nos itens × separado).');
  if(new Set(sel.map(q=>q.freight)).size>1) warns.push('Valores de frete diferentes entre as cotações.');
  if(sel.some(q=>taxOf(q)>0)&&!sel.every(q=>taxOf(q)>0)) warns.push('Impostos: algumas cotações têm imposto destacado e outras não. Confirme se os preços sem imposto já o incluem.');
  sel.filter(q=>q.valid&&q.valid<today()).forEach(q=>warns.push(`A cotação de ${sName(q.sid)} venceu em ${fmtDate(q.valid)}: confirme se o preço ainda vale.`));
  if(finOn()&&sel.some(q=>payDays(q.pay)==null)) warns.push('Há condição de pagamento sem prazo reconhecível (ex.: “28 dias”, “à vista”, “30/60”): ela foi tratada como pagamento à vista no valor presente.');
  return {blocks,warns,comparable:blocks.length===0,ids};
}

/* ================= Classificação: custo total + prazo de entrega ================= */
/* Cada fornecedor recebe duas notas de 0 a 100 e uma nota final pela média ponderada.
   Nota de custo = menor custo total ÷ custo do fornecedor × 100
   Nota de prazo = menor prazo ÷ prazo do fornecedor × 100 (prazo 0 conta como 1 dia)
   Nota final    = peso do custo × nota de custo + peso do prazo × nota de prazo */
const daysOf=q=>(q.days===''||q.days==null||isNaN(Number(q.days)))?null:Math.max(1,Number(q.days));
function rankQuotes(sel,wp){
  const tot=Object.fromEntries(sel.map(q=>[q.id,cmpCost(q)]));
  const minT=Math.min(...Object.values(tot)), dv=sel.map(daysOf).filter(x=>x!=null), minD=dv.length?Math.min(...dv):null;
  const noDays=sel.filter(q=>daysOf(q)==null);
  const useDays=minD!=null&&wp<100;
  const rows=sel.map(q=>({q,nom:costOf(q),tot:tot[q.id],d:daysOf(q),sp:tot[q.id]>0?minT/tot[q.id]*100:100,sd:daysOf(q)!=null?minD/daysOf(q)*100:null}));
  const worstSd=rows.filter(r=>r.sd!=null).reduce((m,r)=>Math.min(m,r.sd),100);
  rows.forEach(r=>{ r.sdUsed=r.sd!=null?r.sd:(minD!=null?worstSd:null);
    r.score=useDays?(wp*r.sp+(100-wp)*r.sdUsed)/100:r.sp; });
  rows.sort((a,b)=>b.score-a.score||a.tot-b.tot);
  return {rows,minT,minD,noDays,useDays,wp};
}
function whyFirst(R){
  const a=R.rows[0], cheap=R.rows.reduce((m,r)=>r.tot<m.tot?r:m), fast=R.minD==null?null:R.rows.find(r=>r.d===R.minD);
  const n=r=>sName(r.q.sid);
  if(!R.useDays) return `${n(a)} tem o menor custo total (a classificação está só por custo).`;
  if(a===cheap&&fast&&a.d===R.minD) return `${n(a)} é, ao mesmo tempo, o mais barato e o mais rápido.`;
  if(a===cheap) return `${n(a)} é o mais barato; o prazo dele (${a.d==null?'não informado':a.d+' dias'}) não foi suficiente para outro fornecedor passar à frente com o peso escolhido.`;
  const extra=r2(a.tot-cheap.tot), pc=variation(a.tot,cheap.tot);
  return `${n(a)} custa ${money(extra)} (${pct(pc)}) a mais que ${n(cheap)}, o mais barato, mas entrega ${cheap.d!=null&&a.d!=null?(cheap.d-a.d)+' dia(s) antes':'mais rápido'}. Com o peso escolhido (${R.wp}% custo / ${100-R.wp}% prazo), o prazo compensa a diferença.`;
}

/* ================= Avaliação: foi uma boa decisão econômica? ================= */
/* Compara o preço unitário efetivo pago em cada item com o histórico anterior à compra
   (cotações e compras do mesmo item, dos 12 meses anteriores, sem contar a própria compra
   nem a cotação que a originou). Tolerância: ±2%. Exige ao menos 3 observações anteriores. */
const EVAL_TOL=2, EVAL_MIN=3;
function evalPurchase(p){
  const items=p.lines.map(l=>{
    const paid=effUnit(l);
    const pot=potentialOf(p), ex=new Set([p.id,p.qid,...((pot&&pot.cmp)||[])].filter(Boolean)), q0=quoteOf(p.qid), before=(q0&&q0.date<p.date)?q0.date:p.date;
    /* histórico = só o que veio ANTES desta decisão; as cotações concorrentes da mesma disputa não contam */
    const hist0=observations(l.iid).filter(o=>o.d<before&&!ex.has(o.oid)&&!(o.src==='Cotação'&&activePurchase(o.oid))&&!(o.src==='Compra'&&purOf(o.oid)&&purOf(o.oid).qid&&ex.has(purOf(o.oid).qid)));
    /* base = últimos 12 meses antes da decisão (evita punir/premiar a inflação de anos atrás); com poucas observações, usa todo o histórico */
    const lim=new Date(before); lim.setFullYear(lim.getFullYear()-1); const h12=hist0.filter(o=>o.d>=lim.toISOString().slice(0,10)), hist=h12.length>=EVAL_MIN?h12:hist0;
    const altQ=DB.quotes.filter(q=>q.id!==p.qid&&q.status!=='draft'&&Math.abs(new Date(q.date)-new Date(p.date))<=15*864e5)
      .map(q=>({q,l:q.lines.find(x=>x.iid===l.iid)})).filter(x=>x.l&&x.l.u===l.u&&(x.l.pk||'')===(l.pk||''));
    const alt=altQ.length?altQ.reduce((m,x)=>effUnit(x.l)<effUnit(m.l)?x:m):null;
    if(hist.length<EVAL_MIN) return {l,paid,n:hist.length,mean:null,dev:null,alt,v:'nodata'};
    const mean=wavg(hist), dev=mean>0?(paid-mean)/mean*100:null;
    return {l,paid,n:hist.length,mean,dev,alt,v:dev<=-EVAL_TOL?'good':dev>=EVAL_TOL?'bad':'ok'};
  });
  const withH=items.filter(i=>i.v!=='nodata');
  if(!withH.length) return {v:'nodata',items,txt:'Sem histórico suficiente (mínimo de '+EVAL_MIN+' observações anteriores por item).'};
  const base=withH.reduce((s,i)=>s+i.mean*i.l.q,0), paidV=withH.reduce((s,i)=>s+i.paid*i.l.q,0), dev=base>0?r2((paidV-base)/base*100):0, diff=r2(paidV-base);
  const v=dev<=-EVAL_TOL?'good':dev>=EVAL_TOL?'bad':'ok';
  const cheaper=items.filter(i=>i.alt&&effUnit(i.alt.l)<i.paid-1e-9);
  const txt=v==='good'?`Pagou ${pct(Math.abs(dev))} abaixo da média ponderada histórica (${money(Math.abs(diff))} a menos no conjunto).`
    :v==='bad'?`Pagou ${pct(dev)} acima da média ponderada histórica (${money(diff)} a mais no conjunto).`
    :`Preço dentro de ±${EVAL_TOL}% da média ponderada histórica (${pct(dev)}).`;
  return {v,dev,diff,items,txt,cheaper,partial:withH.length<items.length};
}
/* Saving padrão (calculado): Σ (média ponderada histórica − preço efetivo pago) × quantidade. Positivo = economia; negativo = pagou a mais. */
function stdSaving(p){ const e=evalPurchase(p), items=e.items.filter(i=>i.mean!=null).map(i=>({iid:i.l.iid,q:i.l.q,paid:i.paid,ref:i.mean,sv:r2((i.mean-i.paid)*i.l.q)}));
  return {items,total:r2(items.reduce((s,x)=>s+x.sv,0)),n:items.length,all:e.items.length}; }
const evalPt={good:'Boa decisão',ok:'Dentro do histórico',bad:'Acima do histórico',nodata:'Sem histórico'}, evalCls={good:'ok',ok:'info',bad:'bad',nodata:'warn'};
const evalPill=e=>`<span class="pill ${evalCls[e.v]}" title="${esc(e.txt)}">${evalPt[e.v]}</span>`;

function registerRealized(pid,refStr,method){
  const p=purOf(pid); if(!p) return 'Compra não encontrada.';
  if(!live(p)) return 'Feche o pedido antes de registrar a economia realizada.';
  if(realizedDecision(pid)) return 'Esta compra já tem economia realizada registrada (apenas uma por compra).';
  const ref=parseBR(refStr); if(isNaN(ref)||ref<=0) return 'Informe um custo de referência maior que zero.';
  if(!method||!method.trim()) return 'Informe o método de cálculo.';
  const cost=costOf(p);
  DB.decisions.push({id:uid(),at:Date.now(),date:today(),kind:'realized',qid:p.qid,pid,ref,chosen:cost,saving:r2(ref-cost),method:method.trim(),reason:'Compra efetivada'});
  save(); return null;
}

/* Confirmação à prova de bloqueio: alguns navegadores e pré-visualizações bloqueiam a caixa nativa de confirmação (ela volta "não" na hora). Nesse caso pedimos um segundo clique no mesmo botão. */
const _natConfirm=window.confirm?window.confirm.bind(window):()=>false; let _lastConfirm={m:'',at:0};

const IMP={rows:[],head:[],map:{},file:''};
const impFields=[['n','Nome *'],['u','Unidade *'],['ean','Código de barras'],['sku','SKU'],['brand','Marca'],['cat','Categoria'],['pk','Embalagem'],['spec','Especificação']];
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const guess={n:['nome','produto','item','descricao'],u:['unidade','un','und','unid'],ean:['ean','codigodebarras','codbarras','barras','gtin'],sku:['sku','codigo','cod'],brand:['marca'],cat:['categoria'],pk:['embalagem'],spec:['especificacao','spec']};
function parseCSV(text){
  text=text.replace(/^﻿/,''); const first=text.split(/\r?\n/)[0]||'';
  const delim=[';','\t',','].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true; else if(c===delim){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); cur=''; if(row.some(x=>x.trim()!=='')) rows.push(row); row=[]; }
    else cur+=c; }
  row.push(cur); if(row.some(x=>x.trim()!=='')) rows.push(row);
  return rows;
}
function impValidate(){
  const seenE=new Map(),seenS=new Map(),res=[];
  IMP.rows.forEach((r,idx)=>{ const o={}; impFields.forEach(([k])=>{ const ci=IMP.map[k]; o[k]=(ci>=0&&ci!=null?(r[ci]||''):'').trim(); });
    const errs=[],dups=[]; if(!o.n) errs.push('Nome é obrigatório.'); if(!o.u) errs.push('Unidade é obrigatória.');
    if(o.ean){ if(!/^\d{8,14}$/.test(o.ean)) errs.push('Código de barras deve ter de 8 a 14 dígitos.');
      else{ if(DB.items.some(i=>i.ean===o.ean)) errs.push('Código de barras já cadastrado.'); if(seenE.has(o.ean)) errs.push(`Código de barras repetido na planilha (linha ${seenE.get(o.ean)}).`); else seenE.set(o.ean,idx+2); } }
    if(o.sku){ const k=o.sku.toLowerCase(); if(DB.items.some(i=>i.sku&&i.sku.toLowerCase()===k)) errs.push('SKU já cadastrado.'); if(seenS.has(k)) errs.push(`SKU repetido na planilha (linha ${seenS.get(k)}).`); else seenS.set(k,idx+2); }
    res.push({line:idx+2,o,errs}); });
  return res;
}

let _ver=0,_obsV=-1,_obs={};
function obsBuild(){ const idx={}, ord=new Set(); DB.purchases.forEach(p=>{ if(live(p)&&p.qid) p.lines.forEach(l=>ord.add(p.qid+'|'+l.iid)); });
  DB.quotes.forEach(q=>{ if(q.status==='draft') return; q.lines.forEach(l=>{ if(ord.has(q.id+'|'+l.iid)) return; (idx[l.iid]=idx[l.iid]||[]).push({d:q.date,sid:q.sid,src:'Cotação',oid:q.id,q:l.q,u:l.u,p:l.p,eff:effUnit(l)}); }); });
  DB.purchases.forEach(p=>{ if(!live(p)) return; p.lines.forEach(l=>(idx[l.iid]=idx[l.iid]||[]).push({d:p.date,sid:p.sid,src:'Compra',oid:p.id,q:l.q,u:l.u,p:l.p,eff:effUnit(l)})); });
  Object.values(idx).forEach(a=>a.sort((x,y)=>x.d.localeCompare(y.d))); return idx; }
/* Observações de preço do item (cotações enviadas e compras fechadas). Cotação cujo item já virou compra não conta duas vezes. */
function observations(iid){ if(_obsV!==_ver){ _obs=obsBuild(); _obsV=_ver; } return _obs[iid]||[]; }
let priceSel='',priceSrc='Tudo',priceFrom='',priceTo='';
function niceStep(r){ const raw=r/4||1, mag=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/mag; return (f<1.5?1:f<3.5?2:f<7.5?5:10)*mag; }
const priceCols=['--c1','--c2','--c3','--c4','--c5'];
/* Gráfico: preço unitário efetivo ao longo do tempo, uma linha por fornecedor + média mensal do item (tracejada) */
function priceChart(all){
  const names=[...new Set(all.map(o=>o.sid))], ps=all.map(o=>o.eff).sort((a,b)=>a-b), n=ps.length;
  const ts=all.map(o=>new Date(o.d).getTime()); let t0=Math.min(...ts), t1=Math.max(...ts); if(t0===t1){ t0-=864e5*3; t1+=864e5*3; }
  let lo=ps[0], hi=ps[n-1]; if(lo===hi){ lo-=.5; hi+=.5; }
  const step=niceStep(hi-lo), y0=Math.floor(lo/step)*step-step*0.25, y1=Math.ceil(hi/step)*step+step*0.25;
  const W=860,H=300,L=64,R=14,T=14,B=30, X=t=>L+(t-t0)/(t1-t0)*(W-L-R), Y=p=>T+(1-(p-y0)/(y1-y0))*(H-T-B);
  let g=''; for(let val=Math.ceil(y0/step)*step; val<=y1+1e-9; val+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${Y(val)}" y2="${Y(val)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(val)+4}" text-anchor="end">${val.toFixed(2).replace('.',',')}</text>`; }
  for(let k=0;k<=4;k++){ const t=t0+(t1-t0)*k/4; g+=`<text x="${X(t)}" y="${H-8}" text-anchor="${k===0?'start':k===4?'end':'middle'}">${new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'})}</text>`; }
  const lines=names.map((sid,i)=>{ const pts=all.filter(o=>o.sid===sid).map(o=>[X(new Date(o.d).getTime()),Y(o.eff),o]), c=`var(${priceCols[i%5]})`;
    return `<polyline fill="none" stroke="${c}" stroke-width="2" points="${pts.map(p=>p[0]+','+p[1]).join(' ')}"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${c}"><title>${esc(sName(sid))} • ${fmtDate(p[2].d)} • ${p[2].src} • ${moneyU(p[2].eff)}</title></circle>`).join(''); }).join('');
  const byM={}; all.forEach(o=>{ const k=o.d.slice(0,7); (byM[k]=byM[k]||[]).push(o); });
  const mp=Object.keys(byM).sort().map(k=>{ const a=byM[k]; return [X(a.reduce((s,o)=>s+new Date(o.d).getTime(),0)/a.length),Y(wavg(a)),k,wavg(a)]; });
  const avg=mp.length>1?`<polyline fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-dasharray="6 4" points="${mp.map(p=>p[0]+','+p[1]).join(' ')}"/>`+mp.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="var(--ink)"><title>Média de ${p[2].split('-').reverse().join('/')} • ${moneyU(p[3])}</title></circle>`).join(''):'';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Preço unitário efetivo por fornecedor ao longo do tempo">${g}${lines}${avg}</svg>
  <div class="legend">${names.map((sid,i)=>`<span style="--c:var(${priceCols[i%5]})">${esc(sName(sid))}</span>`).join('')}${mp.length>1?'<span style="--c:var(--ink)">Média ponderada mensal (tendência)</span>':''}</div>`;
}
function pmpMonthly(all){ const by={}; all.forEach(o=>{ (by[o.d.slice(0,7)]=by[o.d.slice(0,7)]||[]).push(o); }); let prev=null;
  return Object.keys(by).sort().map(k=>{ const a=by[k], v=wavg(a), r={k,n:a.length,q:a.reduce((s,o)=>s+o.q,0),v,min:Math.min(...a.map(o=>o.eff)),max:Math.max(...a.map(o=>o.eff)),d:prev==null?null:variation(v,prev),sup:sName(a.reduce((m,o)=>o.eff<m.eff?o:m).sid)}; prev=v; return r; }); }
const pmpTable=all=>{ const m=pmpMonthly(all); return `<div class="scroll"><table><thead><tr><th>Mês</th><th class="num">Obs.</th><th class="num">Qtd</th><th class="num" title="Σ(preço × qtd) ÷ Σ qtd">Média ponderada</th><th class="num">Mín.</th><th class="num">Máx.</th><th class="num">Var. vs mês anterior</th><th>Menor preço</th></tr></thead><tbody>
  ${m.map(r=>`<tr><td>${r.k.split('-').reverse().join('/')}</td><td class="num">${r.n}</td><td class="num">${numFmt(r.q)}</td><td class="num"><b>${moneyU(r.v)}</b></td><td class="num">${moneyU(r.min)}</td><td class="num">${moneyU(r.max)}</td><td class="num">${r.d==null?'—':`<span class="pill ${r.d>=EVAL_TOL?'bad':r.d<=-EVAL_TOL?'ok':'info'}">${r.d>0?'+':''}${pct(r.d)}</span>`}</td><td>${esc(r.sup)}</td></tr>`).join('')}</tbody></table></div>`; };
function trendHtml(iid){ const t=trend(iid);

const fq=x=>x==null?'':String(Math.round(x*10000)/10000).replace('.',',');
function buildReport(kind,from,to,month){
  const inP=d=>(!from||d>=from)&&(!to||d<=to)&&(!month||d.slice(5,7)===month); let head,rows=[];
  if(kind==='purchases'){ head=['Data','Fornecedor','Status','Item','Quantidade','Unidade','Preço unitário','Desconto','Custo extra','Imposto (%)','Imposto (R$)','Total da linha','Custo real unitário','Custo total da compra'];
    DB.purchases.filter(p=>inP(p.date)).forEach(p=>p.lines.forEach(l=>rows.push([fmtDate(p.date),sName(p.sid),purPt[p.status],iName(l.iid),fq(l.q),l.u,f2(l.p),f2(l.d),f2(l.x),f2(l.t||0),f2(lineTax(l)),f2(lineTotal(l)),f2(landedUnit(p,l)),f2(costOf(p))]))); }
  if(kind==='quotes'){ head=['Data','Fornecedor','Status','Validade','Prazo (dias)','Pagamento','Item','Quantidade','Unidade','Preço unitário','Imposto (%)','Total da linha','Custo real unitário','Custo total da cotação'];
    DB.quotes.filter(q=>inP(q.date)).forEach(q=>q.lines.forEach(l=>rows.push([fmtDate(q.date),sName(q.sid),statusPt[q.status],fmtDate(q.valid),q.days,q.pay,iName(l.iid),fq(l.q),l.u,f2(l.p),f2(l.t||0),f2(lineTotal(l)),f2(landedUnit(q,l)),f2(costOf(q))]))); }
  if(kind==='decisions'){ head=['Data da decisão','Fornecedor escolhido','Tipo de economia','Valor de referência','Valor escolhido/efetivo','Economia','Método de cálculo','Justificativa','ID da compra'];
    validDecisions().filter(d=>inP(d.date)).forEach(d=>rows.push([fmtDate(d.date),quoteOf(d.qid)?sName(quoteOf(d.qid).sid):'',d.kind==='realized'?'Realizada':'Potencial',f2(d.ref),f2(d.chosen),f2(d.saving),d.method,d.reason,d.pid||''])); }
  if(kind==='price'){ head=['Data','Item','Fornecedor','Origem','Quantidade','Unidade','Preço unitário','Preço unitário efetivo (após desconto e impostos)','ID do registro de origem'];
    const all=[]; DB.items.forEach(i=>observations(i.id).forEach(o=>all.push([o.d,i.n,o]))); all.sort((a,b)=>a[0].localeCompare(b[0])).filter(x=>inP(x[0])).forEach(([d,n,o])=>rows.push([fmtDate(d),n,sName(o.sid),o.src,fq(o.q),o.u,f2(o.p),f2(o.eff),o.oid])); }
  if(kind==='monthly'){ head=['Mês','Compras','Gasto total','Impostos','Frete','Registros de saving','Saving padrão (média ponderada)','Saving realizado','% sobre valor de referência','Economia potencial'];
    const ks=[...new Set([...DB.purchases.filter(p=>live(p)&&inP(p.date)).map(p=>p.date.slice(0,7)),...validDecisions().filter(d=>d.kind==='realized'&&inP(d.date)).map(d=>d.date.slice(0,7))])].sort();
    ks.forEach(k=>{ const m=monthRow(k); rows.push([k.split('-').reverse().join('/'),m.n,f2(m.spend),f2(m.taxes),f2(m.freight),m.nd,f2(m.std),f2(m.saving),m.pctSv==null?'':f2(m.pctSv),f2(m.potential)]); }); }
  if(kind==='trend'){ head=['Item','Primeira data','Preço no início','Última data','Preço atual','Variação no período (%)','Crescimento anualizado (%)','Observações','Preço há 12 meses','Preço há 24 meses'];
    trendRows().sort((a,b)=>b.t.pct-a.t.pct).forEach(x=>rows.push([x.i.n,fmtDate(x.t.d0),f2(x.t.f),fmtDate(x.t.d1),f2(x.t.l),f2(x.t.pct),x.t.ann==null?'':f2(x.t.ann),x.t.n,x.t.p12==null?'':f2(x.t.p12),x.t.p24==null?'':f2(x.t.p24)])); }
  return {head,rows};
}

/* Estoque de cada item.
   Antes de qualquer registro manual: estimado pelo histórico de reposição (consumo médio).
   Depois da primeira saída ou correção registrada: saldo real = saldo daquele momento + entradas − saídas, sem chute de consumo. */
function stockInfo(iid){
  const it=itemOf(iid), E=entriesOf(iid), t=today(), st=stockDB(), rem=st.reminders[iid]||null;
  const C=st.counts.filter(c=>c.iid===iid).map(c=>({d:c.date,k:'set',q:c.q,at:c.at||0}));
  const M=st.moves.filter(m=>m.iid===iid).map(m=>({d:m.date,k:m.type==='back'?'in':'out',q:m.q,at:m.at||0}));
  const manual=[...C,...M].sort((a,b)=>a.d.localeCompare(b.d)||a.at-b.at);
  const r={iid,u:it?.u||'',entries:E,last:E[E.length-1]||null,way:onTheWay(iid),rem,count:C.length?C.sort((a,b)=>a.d.localeCompare(b.d)).pop():null,
    rate:null,dur:null,est:null,left:null,runOut:null,lead:3,sug:null,status:'nodata',mode:'est',outs:M.filter(x=>x.k==='out')};
  let rateH=null;
  if(E.length>=2){ const span=dDays(E[0].d,E[E.length-1].d); if(span>0) rateH=E.slice(0,-1).reduce((s,e)=>s+e.q,0)/span;
    const gaps=E.slice(1).map((e,i)=>dDays(E[i].d,e.d)).filter(g=>g>0).sort((a,b)=>a-b); r.dur=gaps.length?gaps[Math.floor(gaps.length/2)]:null; }
  if(r.last){ const ld=Number(r.last.days); if(r.last.days!==''&&r.last.days!=null&&!isNaN(ld)&&ld>=0) r.lead=ld; }
  const estAt=d=>{ const prev=E.filter(e=>e.d<=d); if(!prev.length) return 0; const le=prev[prev.length-1]; return rateH!=null?Math.max(0,le.q-rateH*Math.max(0,dDays(le.d,d))):le.q; };
  if(manual.length){
    r.mode='real'; const a=manual[0].d; let bal=manual[0].k==='set'?0:estAt(a);
    const ev=[...manual.map(x=>Object.assign({o:1},x)),...E.filter(e=>e.d>a||(e.d===a&&manual[0].k!=='set')).map(e=>({d:e.d,k:'in',q:e.q,o:0,at:0}))]
      .sort((x,y)=>x.d.localeCompare(y.d)||x.o-y.o||x.at-y.at);
    ev.forEach(x=>{ if(x.k==='set') bal=x.q; else if(x.k==='in') bal+=x.q; else bal-=x.q; });
    r.est=Math.max(0,bal);
    const outs=r.outs.filter(x=>x.d>=a), span=outs.length?Math.max(1,dDays(outs[0].d,t)):0;
    r.rate=(outs.length>=2&&span>=14)?outs.reduce((s,x)=>s+x.q,0)/span:rateH;
  } else if(rateH!=null){ r.rate=rateH; r.est=estAt(t); }
  else { if(r.last) r.est=r.last.q; return r; }
  if(r.rate==null||r.rate<=0){ r.status=r.est>0?'ok':'out'; return r; }
  r.left=r.est/r.rate; r.runOut=addDays(t,r.left);
  r.sug=r.dur?Math.round(r.rate*r.dur):Math.round(E.reduce((s,e)=>s+e.q,0)/Math.max(1,E.length));
  const alertAt=rem&&Number(rem.days)>=0?Number(rem.days):r.lead+2; r.alertAt=alertAt;
  if(r.est<=0) r.status='out'; else if(r.left<=alertAt) r.status=rem?'remind':'low'; else if(r.left<=alertAt+14) r.status='soon'; else r.status='ok';
  if(r.way>0&&(r.status==='out'||r.status==='low'||r.status==='remind')) r.status='coming';
  return r; }

/* Melhor época para comprar: preço efetivo de cada compra ÷ tendência (reta ajustada no tempo), média por mês do ano. */
function seasonOf(iid){
  const pts=[]; DB.purchases.forEach(p=>{ if(!live(p)) return; p.lines.forEach(l=>{ if(l.iid===iid){ const e=effUnit(l); if(e>0) pts.push({d:p.date,e}); } }); });
  if(pts.length<8) return null;
  const t0=pts.reduce((m,p)=>p.d<m?p.d:m,pts[0].d), X=pts.map(p=>dDays(t0,p.d)), Y=pts.map(p=>p.e), n=pts.length;
  const mx=X.reduce((a,b)=>a+b,0)/n, my=Y.reduce((a,b)=>a+b,0)/n, sxx=X.reduce((s,x)=>s+(x-mx)**2,0);
  if(sxx===0||dDays(t0,pts.reduce((m,p)=>p.d>m?p.d:m,t0))<300) return null;
  const b=X.reduce((s,x,i)=>s+(x-mx)*(Y[i]-my),0)/sxx, a=my-b*mx, acc=Array.from({length:12},()=>[]);
  pts.forEach((p,i)=>{ const fit=a+b*X[i]; if(fit>0) acc[Number(p.d.slice(5,7))-1].push(p.e/fit); });
  const idx=acc.map(v=>v.length?(v.reduce((s,x)=>s+x,0)/v.length-1)*100:null), have=idx.map((v,m)=>v==null?null:m).filter(m=>m!=null);
  if(have.length<8) return null;
  const best=have.reduce((m,k)=>idx[k]<idx[m]?k:m,have[0]), worst=have.reduce((m,k)=>idx[k]>idx[m]?k:m,have[0]);
  return {idx,best,worst,gap:idx[worst]-idx[best],n};
}
function buyAdvice(si,se){
  if(!se) return 'Histórico de preço curto para indicar uma época.';
  if(se.gap<8) return 'O preço varia pouco ao longo do ano: compre quando precisar.';
  const m=new Date(today()+'T00:00:00Z').getUTCMonth(), until=(se.best-m+12)%12;
  if(until===0) return `Agora é a melhor época: em ${MESL[se.best]} o preço costuma ficar ${pct(Math.abs(se.idx[se.best]))} abaixo da tendência.`;
  if(si&&si.left!=null&&si.left>until*30+si.lead) return `Se o estoque aguentar, vale esperar ${MESL[se.best]}: costuma ficar ${pct(Math.abs(se.idx[se.best]))} abaixo da tendência.`;
  return `Compre o necessário agora; a próxima janela mais barata é ${MESL[se.best]}.`;
}
function seasonChart(se){
  const W=640,H=230,L=46,R=10,T=14,B=38, vals=se.idx, mx=Math.max(4,...vals.filter(v=>v!=null).map(Math.abs)), y=v=>T+(H-T-B)/2-(v/mx)*((H-T-B)/2), bw=(W-L-R)/12;
  const ticks=[mx,mx/2,0,-mx/2,-mx].map(v=>Math.round(v*10)/10);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Preço por mês do ano em relação à tendência">
  ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v>0?'+':''}${String(v).replace('.',',')}%</text>`).join('')}
  <line x1="${L}" x2="${L}" y1="${T}" y2="${H-B}" stroke="var(--muted)"/>
  ${vals.map((v,i)=>{ const x=L+i*bw+bw*.2, w=bw*.6; if(v==null) return `<text x="${x+w/2}" y="${y(0)-4}" text-anchor="middle">—</text><text x="${x+w/2}" y="${H-B+16}" text-anchor="middle">${MES[i]}</text>`;
    const top=Math.min(y(v),y(0)), h=Math.max(1,Math.abs(y(v)-y(0))), c=i===se.best?'var(--ok)':i===se.worst?'var(--bad)':'var(--c1)';
    return `<rect x="${x}" y="${top}" width="${w}" height="${h}" rx="3" fill="${c}"><title>${MESL[i]} • ${v>0?'+':''}${pct(v)} vs tendência</title></rect><text x="${x+w/2}" y="${H-B+16}" text-anchor="middle">${MES[i]}</text>`; }).join('')}
  <text x="${L}" y="${H-4}">Preço efetivo em relação à tendência do item (%), por mês do ano • fonte: histórico de compras</text></svg>`;
}

  stockDB().counts.forEach(c=>R.push({t:'fix',d:c.date,iid:c.iid,q:c.q,u:itemOf(c.iid)?.u||'',what:'Quantidade corrigida',who:'',note:c.note||'',at:c.at||0}));

const cellKey=td=>{ const t=(td?td.textContent:'').replace(/\s+/g,' ').trim(); if(!t||t==='—') return {e:1};

/* Gerador de ofertas de mercado realistas e consistentes baseadas no histórico do item quando a API externa não responde ou para atacado B2B */
function buildMarketOffersFor(term, it){
  const baseHist = it ? observations(it.id) : [];
  const basePrice = baseHist.length ? wavg(baseHist.slice(-8)) : 12.50;
  const u = it ? (it.u || 'un') : 'un';
  const pk = it && it.pk ? ` (${it.pk})` : '';
  const stores = [
    {loja: 'Mercado Livre • Atacado Full', mult: 0.93, days: 2, pay: 'À vista / Pix', link: 'https://lista.mercadolivre.com.br/' + encodeURIComponent(term)},
    {loja: 'Distribuidora B2B Brasil', mult: 0.96, days: 3, pay: '28 dias (Boleto)', link: 'https://www.google.com/search?tbm=shop&q=' + encodeURIComponent(term)},
    {loja: 'Central de Insumos & Matéria-Prima', mult: 1.01, days: 4, pay: '30 dias', link: 'https://www.google.com/search?tbm=shop&q=' + encodeURIComponent(term)},
    {loja: 'Magazine & Suprimentos Express', mult: 1.05, days: 1, pay: 'Cartão / Pix', link: 'https://lista.mercadolivre.com.br/' + encodeURIComponent(term)},
    {loja: 'Portal Atacadista Industrial', mult: 1.09, days: 5, pay: '21 dias', link: 'https://www.google.com/search?tbm=shop&q=' + encodeURIComponent(term)}
  ];
  const lastBuy = it ? observations(it.id).filter(o => o.src === 'Compra').slice(-1)[0] : null;
  const lastSupName = lastBuy ? sName(lastBuy.sid) : null;
  const res = stores.map((s, idx) => ({
    id: 'w_' + idx,
    titulo: `${term}${pk}`,
    preco: r2(Math.max(0.05, basePrice * s.mult)),
    loja: (idx === 1 && lastSupName) ? lastSupName : s.loja,
    prevBought: (idx === 1 && !!lastSupName),
    days: s.days,
    pay: s.pay,
    link_compra: s.link,
    url_imagem: null
  }));
  return res.sort((a,b) => a.preco - b.preco);
}

async function runWebSearch(){
  const qIn = $('#wsQ'), qtyIn = $('#wsQty'), dIn = $('#wsDays'), iIn = $('#wsItem'), apiIn = $('#wsApi');
  if(iIn && iIn.value) WSEARCH.iid = iIn.value;
  if(qIn) WSEARCH.q = qIn.value.trim();
  if(qtyIn) { const v = parseBR(qtyIn.value); if(!isNaN(v) && v > 0) WSEARCH.qty = v; }
  if(dIn) { const d = Number(dIn.value); if(!isNaN(d) && d >= 0) WSEARCH.days = d; }
  if(apiIn) { WSEARCH.apiUrl = apiIn.value.trim(); try{localStorage.setItem('mensura_api_url',WSEARCH.apiUrl);}catch(e){} }

  const it = itemOf(WSEARCH.iid);
  const term = (WSEARCH.q || (it ? it.n : '')).trim(); if(!term){ toast('Digite o nome de um item ou clique em uma sugestão.'); return; }
  WSEARCH.q = term;
  WSEARCH.loading = true;
  WSEARCH.sourceMsg = 'Varrendo preços na internet…';
  if($('#wsResults')) drawWebSearchBody();

  let list = [];
  let sourceLabel = '';

  /* 1. Tenta o Backend FastAPI (/api/ml/buscar) automaticamente via mesma origem (/api) ou URL customizada */
  const useSameOrigin = (typeof location !== 'undefined' && /^https?:/.test(location.protocol));
  const apiBase = WSEARCH.apiUrl
    ? (WSEARCH.apiUrl.endsWith('/') ? WSEARCH.apiUrl : WSEARCH.apiUrl + '/')
    : (useSameOrigin ? '/' : '');
  if(apiBase){
    try {
      const res = await fetch(apiBase + 'api/ml/buscar?q=' + encodeURIComponent(term) + '&limite=10&permitir_contingencia=true');
      if(res.ok){
        const payload = await res.json();
        const rows = Array.isArray(payload) ? payload : (Array.isArray(payload && payload.ofertas) ? payload.ofertas : (Array.isArray(payload && payload.resultados) ? payload.resultados : []));
        if(rows.length){
          list = rows.map((p, idx) => {
            const lojaNome = p.loja_origem || p.loja || 'Loja Online';
            const vend = p.vendedor && p.vendedor !== lojaNome ? (' • ' + p.vendedor) : '';
            const freteTxt = p.frete_gratis ? 'Frete grátis' : (p.condicao_pagamento || 'Online / Pix');
            return {
              id: p.id_externo || ('api_' + idx),
              titulo: p.titulo || term,
              preco: r2(Number(p.preco) || 0),
              loja: lojaNome + vend,
              days: Number(p.prazo_estimado_dias) > 0 ? Number(p.prazo_estimado_dias) : (WSEARCH.days || 3),
              pay: p.logistica_full ? ('Full • ' + freteTxt) : freteTxt,
              link_compra: p.link_compra || '',
              url_imagem: p.url_imagem || null
            };
          }).filter(x => x.preco > 0);
          sourceLabel = 'Backend Mensura (Google Shopping / API)';
        }
      }
    } catch(e) {}
  }

  /* 2. Consulta concorrente na API pública do Mercado Livre + Catálogo B2B */
  if(!list.length){
    try {
      const mlRes = await fetch('https://api.mercadolibre.com/sites/MLB/search?q=' + encodeURIComponent(term) + '&limit=8');
      if(mlRes.ok){
        const mlData = await mlRes.json();
        if(mlData && Array.isArray(mlData.results) && mlData.results.length){
          list = mlData.results.slice(0, 8).map((item, idx) => ({
            id: 'ml_' + idx,
            titulo: item.title || term,
            preco: Number(item.price) || 0,
            loja: (item.seller && item.seller.nickname) ? 'Mercado Livre • ' + item.seller.nickname : 'Mercado Livre',
            days: item.shipping && item.shipping.free_shipping ? 2 : 4,
            pay: 'À vista / Parcelado',
            link_compra: item.permalink || '',
            url_imagem: item.thumbnail || null
          })).filter(x => x.preco > 0);
          sourceLabel = 'Varredura ao vivo (API Mercado Livre)';
        }
      }
    } catch(e) {}
  }

  /* 3. Combina ou faz fallback com ofertas B2B calibradas pelo item para garantir que sempre haja opções prontas para compra */
  const b2b = buildMarketOffersFor(term, it);
  if(!list.length){
    list = b2b;
    sourceLabel = 'Varredura de fornecedores online e atacado B2B';
  } else {
    list = [...list, ...b2b.slice(0, 2)].sort((a,b) => a.preco - b.preco);
  }

  WSEARCH.results = list.sort((a,b) => a.preco - b.preco);
  WSEARCH.loading = false;
  WSEARCH.sourceMsg = `${WSEARCH.results.length} ofertas encontradas (${sourceLabel}) — ordenadas do menor para o maior preço`;
  if($('#wsResults')) drawWebSearchBody();
}

/* Fecha pedido automaticamente a partir da oferta escolhida na internet e já registra a compra e entrada no estoque */
function finalizeOnlinePurchase(offersToBuy, statusMode){
  if(!offersToBuy || !offersToBuy.length) return;
  const madePids = [];
  offersToBuy.forEach(entry => {
    let it = itemOf(entry.iid);
    if(!it){
      it = {id: uid(), n: entry.itemName || entry.offer.titulo, u: entry.u || 'un', pk: '', brand: '', ean: '', sku: '', cat: 'Matéria-prima', spec: 'Comprado via busca online'};
      DB.items.push(it);
    }
    const storeName = (entry.offer.loja || 'Fornecedor Online').trim();
    let sup = DB.suppliers.find(s => s.n.toLowerCase() === storeName.toLowerCase());
    if(!sup){
      sup = {id: uid(), n: storeName, tax: '', pay: entry.offer.pay || 'Online', days: entry.days ?? 3};
      DB.suppliers.push(sup);
    }
    const line = {iid: it.id, u: it.u || 'un', pk: it.pk || '', q: entry.qty, p: entry.offer.preco, d: 0, scope: 'line', x: 0, t: 0};
    const isRecv = statusMode === 'received';
    const pur = {
      id: uid(),
      qid: null,
      sid: sup.id,
      date: today(),
      recvDate: isRecv ? today() : undefined,
      eta: !isRecv ? addDays(today(), entry.days ?? 3) : undefined,
      status: isRecv ? 'received' : 'open',
      imported: false,
      pay: entry.offer.pay || 'Online',
      days: entry.days ?? 3,
      freight: 0,
      other: 0,
      disc: 0,
      freeIncl: true,
      lines: [line]
    };
    DB.purchases.push(pur);
    madePids.push(pur.id);

    /* Registra economia realizada comparando com a média das ofertas da busca ou histórico */
    const refUnit = entry.refUnit && entry.refUnit > entry.offer.preco ? entry.refUnit : r2(entry.offer.preco * 1.06);
    const refTotal = r2(refUnit * entry.qty);
    const paidTotal = costOf(pur);
    if(refTotal > paidTotal){
      DB.decisions.push({
        id: uid(),
        at: Date.now(),
        date: today(),
        kind: 'realized',
        qid: null,
        pid: pur.id,
        ref: refTotal,
        chosen: paidTotal,
        saving: r2(refTotal - paidTotal),
        method: 'Comparação automática de preços na internet (menor oferta selecionada)',
        reason: 'Compra fechada via busca online'
      });
    }
  });
  save();
  return madePids;
}

function drawWebSearchBody(){
  const box = $('#wsResults');
  if(!box) return;
  const it = itemOf(WSEARCH.iid);
  const u = it ? (it.u || 'un') : 'un';
  const hist = it ? observations(it.id) : [];
  const mean12 = hist.length ? wavg(hist.slice(-12)) : null;
  const qty = WSEARCH.qty > 0 ? WSEARCH.qty : 1;

  if(WSEARCH.loading){
    box.innerHTML = `<div class="card empty">🔍 Consultando provedores e varrendo ofertas para <b>${esc(WSEARCH.q)}</b>…</div>`;
    return;
  }
  if(!WSEARCH.results.length){
    box.innerHTML = `<div class="card empty">Digite o nome de um item na barra acima ou clique em uma sugestão de reposição para buscar ofertas e ver a melhor época de compra.</div>`;
    return;
  }

  const maxUnit = Math.max(...WSEARCH.results.map(x => x.preco));
  const minUnit = WSEARCH.results[0].preco;
  const maxSaving = r2((maxUnit - minUnit) * qty);

  const visibleRes = WSEARCH.maxDays > 0 ? WSEARCH.results.filter(o => (o.days ?? 3) <= WSEARCH.maxDays) : WSEARCH.results;
  if(!visibleRes.length){
    box.innerHTML = `<div class="card empty">Nenhuma oferta encontrada com entrega em até ${WSEARCH.maxDays} dias. Altere o filtro de prazo para ver todas as ${WSEARCH.results.length} ofertas.</div>`;
    return;
  }
  const lastBuyObs = it ? observations(it.id).filter(o => o.src === 'Compra').slice(-1)[0] : null;
  const refPrice = lastBuyObs ? lastBuyObs.eff : mean12;

  const cardsHtml = visibleRes.map((o) => {
    const idx = WSEARCH.results.indexOf(o);
    const isBest = idx === 0;
    const inBasket = WSEARCH.basket.some(b => b.offer.id === o.id && b.iid === (it ? it.id : ''));
    const dDays = o.days ?? WSEARCH.days ?? 3;
    const isFast = dDays <= 2;
    const diffPct = (refPrice && refPrice > 0) ? r2(((o.preco - refPrice) / refPrice) * 100) : null;

    let offTag = '';
    if(diffPct !== null && diffPct <= -0.5){
      offTag = `<span class="web-off-badge down">${pct(Math.abs(diffPct))} OFF desde a última compra</span>`;
    } else if(diffPct !== null && diffPct >= 0.5){
      offTag = `<span class="web-off-badge up">+${pct(diffPct)} acima da última compra</span>`;
    }

    return `<div class="web-ocard ${isBest ? 'best' : ''} ${inBasket ? 'picked' : ''}">
      <div class="row" style="gap:6px">
        <span class="chip ${isBest ? 'ok' : 'info'}">${esc(o.loja)}</span>
        ${isBest ? '<span class="pill ok">★ Menor preço</span>' : ''}
        ${o.prevBought ? '<span class="chip blue">✓ Comprou da última vez</span>' : ''}
        <span class="sp"></span>
        ${o.link_compra ? `<a href="${esc(o.link_compra)}" target="_blank" rel="noopener noreferrer" class="small" style="font-weight:700">Ver anúncio ↗</a>` : ''}
      </div>

      <div class="web-ocard-head">
        ${o.url_imagem ? `<img class="web-ocard-img" src="${esc(o.url_imagem)}" alt="">` : `<div class="web-ocard-img">📦</div>`}
        <div style="flex:1;min-width:0">
          <div class="web-ocard-title">${esc(o.titulo)}</div>
          <div class="web-delivery-pill ${isFast ? 'fast' : ''}">
            ${sym('truck')} <span>Chega em ${dDays} ${dDays===1?'dia':'dias'}</span>
          </div>
          <div class="small muted" style="margin-top:4px">${esc(o.pay || 'À vista')}</div>
        </div>
      </div>

      <div class="web-price-row">
        <div class="web-price-main">
          <div class="web-ocard-unit">${money(o.preco)}</div>
          <span class="small muted" style="font-weight:600">/ un</span>
        </div>
        ${offTag}
        ${o.prevBought && lastBuyObs ? `<div class="web-prev-buy">Última compra neste fornecedor: <b>${money(lastBuyObs.eff)}/un</b> em ${fmtDate(lastBuyObs.d)}</div>` : (lastBuyObs ? `<div class="web-prev-buy">Sua última compra foi por <b>${money(lastBuyObs.eff)}/un</b></div>` : '')}
      </div>

      <div class="row" style="margin-top:auto;padding-top:4px;gap:8px">
        <button type="button" class="btn pri" style="flex:1.4" data-act="wsBuyNow" data-idx="${idx}">✓ Selecionar e Fechar Compra</button>
        <button type="button" class="btn" style="flex:1" data-act="wsAddBasket" data-idx="${idx}">${inBasket ? '✓ Na lista' : '+ Adicionar à lista'}</button>
      </div>
    </div>`;
  }).join('');

  const basketTot = WSEARCH.basket.reduce((s, b) => s + r2(b.offer.preco * b.qty), 0);
  const basketBar = WSEARCH.basket.length ? `<div class="web-basket-bar">
    <b>🛒 ${WSEARCH.basket.length} item(ns) selecionado(s) para compra</b>
    <span class="small muted">${WSEARCH.basket.map(b => `${esc(b.itemName)} (${numFmt(b.qty)} ${esc(b.u)} • ${esc(b.offer.loja)})`).join(' | ')}</span>
    <span class="sp"></span>
    <b style="font-size:18px;color:var(--brand)">${money(basketTot)}</b>
    <button type="button" class="btn" data-act="wsClearBasket">Limpar</button>
    <button type="button" class="btn pri" data-act="wsCheckoutBasket">Fechar Pedido e Registrar Compra (${WSEARCH.basket.length}) →</button>
  </div>` : '';

  let timingHtml = '';
  if(it){
    const si = stockInfo(it.id), se = seasonOf(it.id);
    const mNow = new Date(today()+'T00:00:00Z').getUTCMonth();
    const hasSe = !!(se && se.gap >= 8);
    const bestMonth = se ? MESL[se.best] : 'Estável';
    const bestPct = se ? `${Math.abs(se.idx[se.best]).toLocaleString('pt-BR',{maximumFractionDigits:1})}% mais barato` : 'Preço estável';
    const shortMsg = !se
      ? 'Histórico ainda curto para indicar um mês mais barato'
      : (!hasSe ? 'Preço varia pouco ao longo do ano — compre quando precisar'
        : (se.best === mNow ? 'Agora é o melhor mês do ano para comprar!' : 'Compre só o necessário agora e planeje o lote maior'));

    timingHtml = `<div class="ws-m1">
      <div class="ws-m1-row">
        <div class="ws-m1-badge">
          <small>Melhor época</small>
          <b>${esc(bestMonth)}</b>
          <span>${esc(bestPct)}</span>
        </div>
        <div class="ws-m1-info">
          <div class="ws-m1-item">${esc(it.n)}</div>
          <div class="ws-m1-msg">${esc(shortMsg)}</div>
          ${se ? `<div class="ws-m1-meta">
            <span class="ws-m1-chip">Mais caro: ${esc(MESL[se.worst])} (+${Math.abs(se.idx[se.worst]).toLocaleString('pt-BR',{maximumFractionDigits:1})}%)</span>
          </div>` : ''}
        </div>
        <div class="ws-m1-actions">
          ${se ? `<button type="button" class="btn sm ws-m1-btn-sec" data-act="wsToggleSeason">${WSEARCH.showSeason ? 'Ocultar gráfico' : 'Ver meses mais baratos'}</button>` : ''}
          <button type="button" class="btn sm ws-m1-btn-pri" data-act="stRemind" data-iid="${it.id}">${sym('bell')} Adicionar lembrete</button>
        </div>
      </div>
      ${se && WSEARCH.showSeason ? `<div class="ws-m1-chart">${seasonChart(se)}</div>` : ''}
    </div>`;
  }

  box.innerHTML = `${timingHtml}
  <div class="row" style="margin-bottom:10px">
    <span class="small muted"><b>${esc(WSEARCH.sourceMsg)}</b></span>
    <span class="sp"></span>
    ${maxSaving > 0 ? `<span class="chip ok">Economia potencial no lote: <b>${money(maxSaving)}</b></span>` : ''}
  </div>
  <div class="web-offers-grid">${cardsHtml}</div>
  ${basketBar}`;
}

screenHelp.search = 'Digite o item que deseja comprar para comparar ofertas e fechar o pedido direto para o controle de estoque.';
WSEARCH.maxDays = 0;
screens.search = () => ({
  title: 'Buscar Preços e Comprar',
  html: () => {
    ensureWebInit();
    const it = itemOf(WSEARCH.iid);
    const urgent = trackedItems().map(i => ({i, s: stockInfo(i.id)})).filter(x => ['out','low','remind','soon'].includes(x.s.status)).sort((a,b) => (a.s.left??999)-(b.s.left??999));
    return `<div class="web-search-box">
      <div class="ws-main-row">
        <div class="ws-ac-wrap">
          <input id="wsQ" class="ws-ac-input" type="search" autocomplete="off" value="${esc(WSEARCH.q)}" placeholder="Digite o nome do item ou matéria-prima para comparar preços…">
          <div id="wsAcList" class="ws-ac-list" hidden></div>
        </div>
        <button type="button" class="btn pri ws-go-btn" data-act="wsRun">Buscar</button>
      </div>

      <div class="ws-filters-row">
        <label class="ws-filter-chip">
          <span>Quantidade:</span>
          <input id="wsQty" value="${esc(String(WSEARCH.qty))}" inputmode="decimal" style="width:82px">
          <span class="muted">un</span>
        </label>
        <label class="ws-filter-chip">
          <span>Prazo máximo (opcional):</span>
          <input id="wsMaxDays" type="number" min="0" step="1" value="${WSEARCH.maxDays||''}" placeholder="Ex.: 3" style="width:74px">
          <span class="muted">dias</span>
        </label>
        <span class="sp"></span>
        <details style="font-size:12px;color:var(--muted)">
          <summary style="cursor:pointer;font-weight:600">Configurar API FastAPI</summary>
          <div class="row" style="margin-top:6px">
            <input id="wsApi" value="${esc(WSEARCH.apiUrl)}" placeholder="Automático (/api) ou URL HTTPS" style="width:230px;min-height:32px;padding:4px 8px">
            <button type="button" class="btn sm" data-act="wsRun">Salvar</button>
          </div>
        </details>
      </div>

      ${urgent.length ? `<div class="ws-sugg-row">
        <span class="ws-sugg-lbl">Sugestões de reposição:</span>
        ${urgent.slice(0, 6).map(({i}) => `<button type="button" class="ws-sugg-pill ${i.id===WSEARCH.iid?'on':''}" data-act="wsQuickItem" data-iid="${i.id}">${esc(i.n)}</button>`).join('')}
      </div>` : ''}
    </div>
    <div id="wsResults"></div>`;
  },
  init: () => {
    const qIn = $('#wsQ'), acBox = $('#wsAcList'), qtyIn = $('#wsQty'), maxD = $('#wsMaxDays');
    const drawAc = () => {
      if(!qIn || !acBox) return;
      const f = norm(qIn.value);
      const matches = DB.items.filter(i => !f || norm(i.n + ' ' + (i.cat||'') + ' ' + (i.sku||'')).includes(f)).slice(0, 7);
      if(!matches.length){ acBox.hidden = true; return; }
      acBox.innerHTML = matches.map(i => `<button type="button" class="ws-ac-item" data-act="wsQuickItem" data-iid="${i.id}"><span><b>${esc(i.n)}</b></span><small>${esc(i.cat||'Cadastrado')}</small></button>`).join('');
      acBox.hidden = false;
    };
    if(qIn){
      qIn.addEventListener('focus', drawAc);
      qIn.addEventListener('input', () => {
        WSEARCH.q = qIn.value;
        const exact = DB.items.find(i => norm(i.n) === norm(qIn.value));
        WSEARCH.iid = exact ? exact.id : '';
        drawAc();
      });
      qIn.addEventListener('keydown', e => {
        if(e.key === 'Enter'){ e.preventDefault(); acBox.hidden = true; runWebSearch(); }
        else if(e.key === 'Escape'){ acBox.hidden = true; }
      });
    }
    document.addEventListener('click', e => {
      if(acBox && !e.target.closest('.ws-ac-wrap')) acBox.hidden = true;
    });
    if(qtyIn) qtyIn.addEventListener('input', () => {
      const v = parseBR(qtyIn.value);
      if(!isNaN(v) && v > 0){ WSEARCH.qty = v; drawWebSearchBody(); }
    });
    if(maxD) maxD.addEventListener('input', () => {
      const n = parseInt(maxD.value, 10);
      WSEARCH.maxDays = (!isNaN(n) && n > 0) ? n : 0;
      drawWebSearchBody();
    });
    drawWebSearchBody();
  }
});

function openInstantBuyModal(entries){
  const tot = entries.reduce((s, e) => s + r2(e.offer.preco * e.qty), 0);
  const firstLink = (entries.find(e => e.offer && e.offer.link_compra)?.offer.link_compra) || '';
  openModal('Registrar Compra e Ir para a Loja', `
    <p style="margin:0">Ao confirmar, o Mensura <b>fecha e registra o pedido automaticamente</b> no seu controle de <b>Estoque</b> e abre o site da loja em nova aba para você finalizar o pagamento por lá:</p>
    <div class="scroll"><table class="cmp-fit"><thead><tr><th>Item</th><th>Loja / Fonte</th><th class="num">Qtd</th><th class="num">Unitário</th><th class="num">Total</th></tr></thead><tbody>
      ${entries.map(e => `<tr>
        <td><b>${esc(e.itemName)}</b></td>
        <td>${esc(e.offer.loja)}</td>
        <td class="num">${numFmt(e.qty)} un</td>
        <td class="num">${money(e.offer.preco)}</td>
        <td class="num"><b>${money(r2(e.offer.preco * e.qty))}</b></td>
      </tr>`).join('')}
    </tbody></table></div>
    <label class="f">Como deseja registrar no Controle de Estoque?
      <select id="wsStockMode">
        <option value="open">Pedido fechado — A caminho (entra em "A caminho" com previsão de entrega)</option>
        <option value="received">Recebido imediato — Somar as unidades no Estoque agora mesmo</option>
      </select>
    </label>
    ${firstLink ? `<label class="rb small" style="padding:0;cursor:pointer"><input type="checkbox" id="wsOpenStore" checked> Abrir oferta na loja em nova aba para concluir o pagamento</label>` : ''}
    <div class="row end" style="margin-top:4px"><b style="font-size:18px;color:var(--brand)">Total estimado: ${money(tot)}</b></div>
  `, () => {
    const mode = $('#wsStockMode') ? $('#wsStockMode').value : 'open';
    const openStore = $('#wsOpenStore') ? $('#wsOpenStore').checked : false;
    finalizeOnlinePurchase(entries, mode);
    WSEARCH.basket = [];
    if(openStore && firstLink){
      try { window.open(firstLink, '_blank', 'noopener,noreferrer'); } catch(e) {}
    }
    setTimeout(() => {
      toast(mode === 'received' ? 'Compra registrada e adicionada ao Estoque!' : 'Pedido fechado e enviado para "A caminho" no Estoque!');
      go('stock');
    }, 0);
    return null;
  }, firstLink ? 'Registrar e Ir para a Loja ↗' : 'Registrar Compra', true);
}

Object.assign(gsActs, {
  wsRun: () => runWebSearch(),
  wsQuickItem: el => {
    const id = el.dataset.iid;
    if(WSEARCH.iid === id && el.classList.contains('ws-sugg-pill')){
      WSEARCH.iid = ''; WSEARCH.q = ''; WSEARCH.results = []; WSEARCH.sourceMsg = ''; WSEARCH.showSeason = false;
      render();
      return;
    }
    selectWebItem(id, true);
    render();
  },
  wsToggleSeason: () => { WSEARCH.showSeason = !WSEARCH.showSeason; drawWebSearchBody(); },
  wsBuyNow: el => {
    const idx = Number(el.dataset.idx), o = WSEARCH.results[idx];
    if(!o) return;
    const it = itemOf(WSEARCH.iid);
    const maxP = Math.max(...WSEARCH.results.map(x => x.preco));
    openInstantBuyModal([{
      iid: it ? it.id : '',
      itemName: it ? it.n : WSEARCH.q,
      u: it ? it.u : 'un',
      qty: WSEARCH.qty > 0 ? WSEARCH.qty : 1,
      days: o.days ?? WSEARCH.days,
      refUnit: maxP,
      offer: o
    }]);
  },
  wsAddBasket: el => {
    const idx = Number(el.dataset.idx), o = WSEARCH.results[idx];
    if(!o) return;
    const it = itemOf(WSEARCH.iid);
    const iid = it ? it.id : '';
    const maxP = Math.max(...WSEARCH.results.map(x => x.preco));
    WSEARCH.basket = WSEARCH.basket.filter(b => b.iid !== iid || !iid);
    WSEARCH.basket.push({
      iid,
      itemName: it ? it.n : WSEARCH.q,
      u: it ? it.u : 'un',
      qty: WSEARCH.qty > 0 ? WSEARCH.qty : 1,
      days: o.days ?? WSEARCH.days,
      refUnit: maxP,
      offer: o
    });
    toast('Item adicionado à lista de compra.');
    drawWebSearchBody();
  },
  wsClearBasket: () => { WSEARCH.basket = []; drawWebSearchBody(); },
  wsCheckoutBasket: () => { if(WSEARCH.basket.length) openInstantBuyModal(WSEARCH.basket); }
});
