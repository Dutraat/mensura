services:
  - type: web
    name: mensura-api
    runtime: python
    plan: free
    branch: master
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: MENSURA_CACHE_TTL
        value: "86400"
      - key: SERPER_API_KEY
        sync: false
